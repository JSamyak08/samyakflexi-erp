<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/samyak-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>FlexiERP - Samyak International Ltd</title>
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Android / Chrome Theme & Capabilities -->
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0284c7" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FlexiERP" />
    <meta name="description" content="Samyak FlexiERP - Enterprise Resource Planning & Production Automation System" />
    
    <!-- iOS / Apple Web App Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlexiERP" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png" />

    <!-- Apple Touch Startup Splash Screens -->
    <link rel="apple-touch-startup-image" href="/icons/icon-512x512.png" />

    <!-- Microsoft / Windows Tile -->
    <meta name="msapplication-TileColor" content="#0284c7" />
    <meta name="msapplication-TileImage" content="/icons/icon-192x192.png" />
  </head>
  <body>
    <div id="root">
      <!-- Professional Corporate PWA Splash Screen -->
      <div id="pwa-splash" style="position:fixed;inset:0;background:#ffffff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;z-index:999999;-webkit-font-smoothing:antialiased;">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:320px;">
          <div style="margin-bottom:28px;">
            <img src="/samyak-logo.png" alt="Samyak International Ltd" style="height:46px;max-width:220px;width:auto;object-fit:contain;display:block;" />
          </div>
          <div style="width:200px;height:2.5px;background:#f1f5f9;border-radius:999px;overflow:hidden;position:relative;margin-bottom:14px;">
            <div style="position:absolute;top:0;bottom:0;width:45%;background:#0284c7;border-radius:999px;animation:splashBar 1.4s ease-in-out infinite;"></div>
          </div>
          <div style="font-size:12px;color:#64748b;font-weight:500;letter-spacing:-0.01em;">
            Loading FlexiERP...
          </div>
        </div>
        <div style="position:absolute;bottom:max(20px,env(safe-area-inset-bottom,20px));left:0;right:0;text-align:center;font-size:11px;font-weight:500;color:#94a3b8;letter-spacing:0.02em;">
          Samyak International Ltd • Indore Manufacturing Unit
        </div>
        <style>
          @keyframes splashBar{0%{left:-45%}100%{left:100%}}
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
