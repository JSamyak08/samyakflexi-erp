<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/samyak-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>FlexiERP - Samyak International Ltd</title>
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Android / Chrome Theme & Capabilities -->
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0284c7" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FlexiERP" />
    <meta name="description" content="Samyak FlexiERP - Enterprise Resource Planning & Production Automation System" />
    
    <!-- iOS / Apple Web App Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlexiERP" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png" />

    <!-- Apple Touch Startup Splash Screens -->
    <link rel="apple-touch-startup-image" href="/icons/icon-512x512.png" />

    <!-- Microsoft / Windows Tile -->
    <meta name="msapplication-TileColor" content="#0284c7" />
    <meta name="msapplication-TileImage" content="/icons/icon-192x192.png" />
  </head>
  <body>
    <div id="root">
      <!-- Modern PWA Cold-Start Splash Screen -->
      <div id="pwa-splash" style="position:fixed;inset:0;background:radial-gradient(circle at 50% 45%, #ffffff 0%, #f8fafc 70%, #f1f5f9 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;font-family:'Outfit','Inter',system-ui,-apple-system,sans-serif;color:#0f172a;z-index:999999;-webkit-font-smoothing:antialiased;">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;max-width:380px;width:100%;">
          <div style="position:relative;margin-bottom:20px;display:flex;align-items:center;justify-content:center;">
            <div style="position:absolute;inset:-10px;border-radius:50%;border:2px dashed rgba(2,132,199,0.25);animation:splashSpin 12s linear infinite;"></div>
            <div style="width:84px;height:84px;border-radius:22px;background:#ffffff;border:1px solid #e2e8f0;box-shadow:0 8px 24px rgba(15,23,42,0.08);display:flex;align-items:center;justify-content:center;padding:12px;">
              <img src="/samyak-logo.png" alt="Samyak Logo" style="max-height:100%;max-width:100%;object-fit:contain;" />
            </div>
          </div>
          <h1 style="font-size:1.15rem;font-weight:800;letter-spacing:0.04em;margin:0 0 4px 0;color:#0f172a;text-transform:uppercase;">
            Samyak International Ltd
          </h1>
          <div style="font-size:0.8rem;font-weight:600;color:#0284c7;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:20px;">
            FlexiERP Operating System
          </div>
          <div style="width:240px;height:4px;background:#e2e8f0;border-radius:999px;overflow:hidden;position:relative;margin-bottom:12px;">
            <div style="position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#0284c7,#0ea5e9);border-radius:999px;animation:splashBar 1.6s ease-in-out infinite;"></div>
          </div>
          <div style="font-size:0.78rem;color:#64748b;font-weight:500;">
            Loading Workspace...
          </div>
        </div>
        <style>
          @keyframes splashSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
          @keyframes splashBar{0%{left:-50%}100%{left:100%}}
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
