<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/samyak-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>FlexiERP - Samyak International Ltd</title>
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Android / Chrome Theme & Capabilities -->
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0284c7" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FlexiERP" />
    <meta name="description" content="Samyak FlexiERP - Enterprise Resource Planning & Production Automation System" />
    
    <!-- iOS / Apple Web App Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlexiERP" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png" />

    <!-- Apple Touch Startup Splash Screens -->
    <link rel="apple-touch-startup-image" href="/icons/icon-512x512.png" />

    <!-- Microsoft / Windows Tile -->
    <meta name="msapplication-TileColor" content="#0284c7" />
    <meta name="msapplication-TileImage" content="/icons/icon-192x192.png" />
  </head>
  <body>
    <div id="root">
      <!-- Modern PWA Cold-Start Splash Screen -->
      <div id="pwa-splash" style="position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%, #0f172a 0%, #090d16 65%, #020617 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;font-family:'Outfit','Inter',system-ui,-apple-system,sans-serif;color:#ffffff;z-index:999999;-webkit-font-smoothing:antialiased;">
        <div style="position:relative;margin-bottom:24px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(2,132,199,0.45) 0%,rgba(6,182,212,0.2) 50%,transparent 70%);filter:blur(16px);animation:splashPulse 2.5s ease-in-out infinite;"></div>
          <div style="width:84px;height:84px;border-radius:22px;background:#ffffff;border:1px solid rgba(255,255,255,0.2);padding:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 15px 35px rgba(0,0,0,0.5),0 0 25px rgba(2,132,199,0.3);position:relative;z-index:1;">
            <img src="/samyak-logo.png" alt="Samyak Logo" style="max-width:100%;max-height:100%;object-fit:contain;" />
          </div>
        </div>
        <div style="font-size:0.75rem;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:#38bdf8;margin-bottom:6px;background:rgba(2,132,199,0.15);padding:4px 14px;border-radius:999px;border:1px solid rgba(56,189,248,0.3);">
          SAMYAK INTERNATIONAL LTD.
        </div>
        <h1 style="font-size:1.6rem;font-weight:900;letter-spacing:0.02em;margin:0 0 6px 0;background:linear-gradient(135deg,#ffffff 0%,#e2e8f0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;">
          Flexi-ERP System
        </h1>
        <div style="font-size:0.82rem;color:#94a3b8;font-weight:500;margin-bottom:28px;text-align:center;">
          Enterprise Production & Resource Platform
        </div>
        <div style="width:200px;height:4px;background:rgba(255,255,255,0.1);border-radius:999px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;bottom:0;width:45%;background:linear-gradient(90deg,#0284c7,#06b6d4,#10b981);border-radius:999px;animation:splashBar 1.6s ease-in-out infinite;"></div>
        </div>
        <style>
          @keyframes splashPulse{0%,100%{transform:scale(1);opacity:0.6}50%{transform:scale(1.15);opacity:1}}
          @keyframes splashBar{0%{left:-45%}100%{left:100%}}
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
